unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

set -g set-clipboard on

set -g base-index 1
set -g pane-base-index 1

set-option -g default-terminal "screen-256color"

set -g status-style bg=default
set -g status-left ""
set -g status-right "#[bg=#fbf1c7, fg=#665c64] #S "

set -g pane-border-style "fg=#d8c3a5"
set -g pane-active-border-style "fg=#d8c3a5"

set -g renumber-windows on

set -g window-status-current-format '#[bg=#fbf1c7, fg=#32302f] #I:#W #[defalut]'

set-option -g focus-events on

set -g escape-time 0
set -g mouse on
set -g repeat-time 1000
set -g history-limit 10000

# bindings
setw -g mode-keys vi

bind h split-window -v
bind v split-window -h

bind-key j display-popup -E "wycry"

bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R

